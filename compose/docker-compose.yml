name: compras # pinned so volume/network names do not depend on the folder name
# Shared base. Do not run on its own: combine it with the dev or prod override.
# All required values come from .env (copy .env.example); missing ones abort `up`.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ordenes_compra
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432" # host-only; 5433 avoids a native Postgres on 5432; in prod use an SSH tunnel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d ordenes_compra"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ordenes_compra
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      APP_CORS_ALLOWED_ORIGIN: https://compras.${DOMAIN:?DOMAIN is required}
    # TCP check: the runtime image has no curl/wget and the app has no actuator.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  frontend:
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  reverse-proxy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
